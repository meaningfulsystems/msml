[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msml"
version = "0.1.1"
description = "Meaningful Systems Modeling Language renderer and validator"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Meaningful Systems", email = "andrew@meaningfulsystems.com" }
]
keywords = ["systems", "modeling", "sysml", "diagrams", "architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/meaningfulsystems/msml"
Repository = "https://github.com/meaningfulsystems/msml"
Specification = "https://github.com/meaningfulsystems/msml/blob/main/msml-specification.md"

[project.scripts]
msml-render = "msml.render:main"
msml-render-all = "msml.render_all:main"
msml-validate = "msml.validate:main"
msml-validate-all = "msml.validate_all:main"
msml-spec = "msml.spec:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msml = ["msml-specification.md"]
